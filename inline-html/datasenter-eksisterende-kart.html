    const map = L.map('dc-map', {
      zoomControl: true,
      scrollWheelZoom: false
    }).setView([64.4, 11.0], 4.6);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    const toNumber = (value) => {
      if (value === null || value === undefined || value === '') return null;
      const num = Number(value);
      return Number.isFinite(num) ? num : null;
    };

    const formatNumber = (value) => {
      const num = toNumber(value);
      if (num === null) return '–';
      return num.toLocaleString('nb-NO');
    };

    const formatYear = (value) => value ? String(value) : '–';

    const formatAddress = (row) => {
      const parts = [row.forretningsadresse, row.forretnings_poststed].filter(Boolean);
      return parts.length ? parts.join(', ') : '–';
    };

    const makeTooltip = (row) => {
      return `
        <div class="dc-tooltip">
          <strong>${row.navn || 'Ukjent'}</strong><br/>
          Adresse: ${formatAddress(row)}<br/>
          Regnskapsår: ${formatYear(row.regnskapsaar)}<br/>
          Omsetning: ${formatNumber(row.omsetning)}<br/>
          Årsresultat: ${formatNumber(row.arsresultat)}
        </div>
      `;
    };

    const showError = (message) => {
      const card = document.querySelector('.dc-card');
      const error = document.createElement('div');
      error.className = 'dc-error';
      error.textContent = message;
      card.appendChild(error);
    };

    const points = DATA
      .map((row) => ({
        ...row,
        lat: toNumber(row.lat),
        lon: toNumber(row.lon)
      }))
      .filter((row) => row.lat !== null && row.lon !== null);

    if (!points.length) {
      showError('Fant ingen koordinater å kartfeste.');
    } else {
      points.forEach((row) => {
        const marker = L.circleMarker([row.lat, row.lon], {
          radius: 6,
          color: '#60a5fa',
          weight: 2,
          fillColor: '#60a5fa',
          fillOpacity: 0.6
        }).addTo(map);

        marker.bindTooltip(makeTooltip(row), {
          direction: 'top',
          offset: [0, -6],
          opacity: 0.95
        });
      });
    }
  </script>
</body>
</html>
